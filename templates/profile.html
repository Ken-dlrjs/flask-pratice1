{% extends "base.html" %}

{% block title %}{{username}} 님의 프로필{% endblock %}

{% block content %}
    <h1> {{username}} 님의 프로필</h1>
    {% if posts: %}
        <h2>글 목록 ({{posts|length}}개)</h2>
        <ul>
        {% for post in posts %}
            <li>{{ loop.index }}. {{ post }}</li>
        {% endfor %}
        </ul>
    {% else %} 
        <p>작성한 글이 없습니다.</p>
    {% endif %}
{% endblock %}
