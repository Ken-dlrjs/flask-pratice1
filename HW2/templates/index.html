{% extends "base.html" %}

{% block title %}Todo List - Todo App {% endblock %}

{% block content %}
<h2>Add New Todo</h2>
<form method="POST">
    <input type="text" name="todo" required>
    <button type="submit">Add Todo</button>
</form>

<h2>Todo List</h2>
{% if todos %}
<ul>
    {% for todo in todos %}
    <li class = "{% if todo.done %} done {endif %}"">
        {{ todo.text }}
        <a heref="{{ url_for('toggle', index=loop.index0) }}">완료</a>
        <a href="{{ url_for('delete', index=loop.index0) }}">Delete</a>
    </li>
    {% endfor %}
</ul>
{% else %}
    <p>No todos yet. Add some!</p>
{% endif %}
{% endblock %}
